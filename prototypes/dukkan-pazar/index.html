<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kervan Dükkân ve Pazar</title>
<style>
:root{color-scheme:light;--bg:#f3eee4;--card:#fffdf8;--ink:#1c2420;--mut:#6f766f;--line:#e2dbcd;--green:#17794a;--greenbg:#e3f1e8;--red:#b8402f;--redbg:#f8e4df;--amber:#a86a00;--amberbg:#fbeccb;--dark:#1c2420}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d9d2c3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{background:var(--dark);color:#f3eee4;padding:12px 16px 10px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
#cash{font-size:30px;font-weight:700;letter-spacing:-.02em}
#cash.neg{color:#ff9b8a}
.hbtn{background:#2f3a34;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-width:44px;min-height:34px}
.mk{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px}
.chip{border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.st-sakin{background:#3a4640;color:#e8e2d4}.st-canli{background:#1f8f58;color:#fff}.st-kotu{background:#b8402f;color:#fff}
.bar{flex:1;height:4px;background:#3a4640;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:#c9b26a}
main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:13px 0 15px;font-weight:700;color:var(--mut);font-size:14px;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.depo{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.depo i{display:block;height:100%;background:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:15px}
.kv span{font-size:11px;color:var(--mut)}
.price{display:flex;align-items:center;gap:10px;margin-top:12px}
.step{width:46px;height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:22px;font-weight:700}
.step:active,.btn:active,.lst:active{transform:scale(.97)}
.pmid{flex:1;text-align:center}.pmid b{font-size:22px}
.btn{white-space:nowrap;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;min-height:46px}
.btn.g{background:var(--green)}.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4}
.full{width:100%;display:block;text-align:center}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.q{background:var(--bg);border:1px solid var(--line)}.tag.hi{background:var(--greenbg);color:var(--green);border-color:transparent}
.tag.k{background:var(--amberbg);color:var(--amber)}.tag.best{background:var(--ink);color:#fff}
.up{color:var(--green)}.dn{color:var(--red)}
.feed{font-size:13px}.feed div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.feed div:last-child{border:0}.feed .new{animation:fl .8s}
@keyframes fl{from{background:var(--greenbg)}to{background:transparent}}
.prods{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 2px;scrollbar-width:none}
.prods::-webkit-scrollbar{display:none}
.prods button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;min-width:96px}
.prods button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prods b{display:block;font-size:14px}.prods span{font-size:12px;opacity:.8}
.lst{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.lst.sys{border-style:dashed}
.lst .net{font-size:19px;font-weight:800;color:var(--green)}
.lst .sm{font-size:12px;color:var(--mut)}
.hint{background:var(--amberbg);border-color:transparent}
.lvl{background:var(--dark);color:#f3eee4;border-color:var(--dark)}.lvl .sub{color:#b9c0b8}.lvl .depo{background:#3a4640}.lvl .depo i{background:#c9b26a}
.lvl b.big{font-size:26px}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.al:last-child{border:0}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13px}
.lock{opacity:.55}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px}
.goal .depo i{background:var(--green)}
#sheetbg{position:absolute;inset:0;background:rgba(20,24,22,.45);display:none;align-items:flex-end;z-index:5}
#sheetbg.on{display:flex}
#sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:88%;overflow-y:auto}
input[type=range]{width:100%;height:36px;accent-color:var(--green)}
.qk{display:flex;gap:8px;margin:6px 0 12px}.qk button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-weight:700}
.tbl{width:100%;font-size:14px;border-collapse:collapse;margin:8px 0 14px}.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}.tbl td:last-child{text-align:right;font-weight:700}
#toast{position:absolute;left:14px;right:14px;bottom:66px;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:6}
#toast.on{opacity:1;transform:none}
svg.sp{display:block;width:100%;height:38px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hrow">
    <div><div class="lbl">Kasa</div><div id="cash" class="num">0</div></div>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="text-align:right;margin-right:4px"><div class="lbl" id="day">1. gün</div><div class="num" style="font-size:13px" id="ppm">+0 TL/dk</div></div>
      <button class="hbtn" id="spd" data-a="speed">1×</button>
      <button class="hbtn" data-a="settings">Ayar</button>
    </div>
  </div>
  <div class="mk"><span class="chip" id="mst">Sakin piyasa</span><div class="bar"><i id="mbar"></i></div><span class="num" id="mcd">0:00</span></div>
</header>
<main id="main"></main>
<nav><button data-a="tab" data-v="home" id="t-home">Ana sayfa</button><button data-a="tab" data-v="shop" id="t-shop">Dükkân</button><button data-a="tab" data-v="market" id="t-market">Pazar</button></nav>
<div id="toast"></div>
<div id="sheetbg" data-a="closebg"><div id="sheet"></div></div>
</div>
<script>
"use strict";
/* ---- Ayar değerleri: dengenin tamamı burada ---- */
const CONFIG={
  startCash:3000, daySec:240, marketSec:150, rateScale:1, rentScale:1, shipPerKm:0.004, churnSec:12, xpBase:1800, xpPow:2.2, loanRatio:.6, interestDay:.04,
  states:{sakin:{ad:"Sakin piyasa",m:1},canli:{ad:"Canlı piyasa",m:1.12},kotu:{ad:"Kötü piyasa",m:0.88}},
  sizes:[{ad:"Küçük",shelves:1,depot:1200,rent:120,costK:0},{ad:"Orta",shelves:3,depot:3000,rent:300,costK:.6},{ad:"Büyük",shelves:6,depot:6000,rent:700,costK:3}],
  types:[
    {id:"bakkal",ad:"Bakkal",level:1,cost:3500,tier:1,products:[["makarna","Makarna",14],["un","Un",22],["seker","Şeker",36],["cay","Çay",42],["pirinc","Pirinç",48],["yag","Ayçiçek yağı",78]]},
    {id:"manav",ad:"Manav",level:3,cost:6000,tier:1.1,products:[["sogan","Soğan",12],["patates","Patates",16],["domates","Domates",28],["elma","Elma",34],["limon","Limon",40],["muz","Muz",62]]},
    {id:"kuruyemis",ad:"Kuruyemişçi",level:6,cost:18000,tier:2,products:[["leblebi","Leblebi",60],["cekirdek","Ay çekirdeği",70],["findik","Fındık",95],["kayisi","Kuru kayısı",180],["ceviz","Ceviz",240],["fistik","Antep fıstığı",320]]},
    {id:"tekel",ad:"Tekel bayii",level:9,cost:40000,tier:3,products:[["soda","Soda",12],["cakmak","Çakmak",18],["bira","Bira",55],["sigara","Sigara",85],["sarap","Şarap",220],["raki","Rakı",650]]}],
  cities:[["İstanbul",20],["Kocaeli",110],["Bursa",243],["Eskişehir",325],["Ankara",453],["İzmir",480],["Konya",660],["Nevşehir",730],["Samsun",735],["Mersin",932],["Adana",940],["Trabzon",1070],["Gaziantep",1140]],
  sellers:["Yıldız Gıda","Akçay Toptan","Demirci Ticaret","Bereket Pazarlama","Öztürk Kardeşler","Anadolu Dağıtım","Karaca Gıda","Marmara Toptan","Güneş Ticaret","Sarıkaya Gıda","Poyraz Dağıtım","Toros Pazarlama"]
};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const P={},T={},PIDS=[];
CONFIG.types.forEach(t=>{T[t.id]=t;t.products.forEach((a,ix)=>{P[a[0]]={lvl:t.level+Math.max(0,ix-2),id:a[0],ad:a[1],sys:a[2],type:t.id,rate:+(45/Math.sqrt(a[2])).toFixed(1),markup:clamp(.5-.06*Math.log(a[2]),.18,.42)};PIDS.push(a[0])})});
let seed=Date.now()%2147483647;
function rnd(){seed=seed*48271%2147483647;return seed/2147483647}
const rr=(a,b)=>a+rnd()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(rnd()*a.length)];
const tl=(x,d)=>x.toLocaleString("tr-TR",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});
let S, lid=1;

/* ---- Motor ---- */
function mkShop(type){const sh={type,val:T[type].cost,size:0,shelves:[],stock:{},acc:{}};T[type].products.forEach(a=>{sh.stock[a[0]]={q:0,qual:0,cost:0};sh.acc[a[0]]=0});fitShelves(sh);return sh}
function fitShelves(sh){while(sh.shelves.length<CONFIG.sizes[sh.size].shelves)sh.shelves.push(null)}
function newGame(){
  S={cash:CONFIG.startCash,debt:0,t:0,day:1,xp:0,level:1,shops:[mkShop("bakkal")],cur:0,sel:{},feed:[],listings:{},
     market:{state:"sakin",nextAt:CONFIG.marketSec,mult:{},hist:{}},churnAt:CONFIG.churnSec,d:{rev:0,buy:0,sold:0},dead:false,speed:1,tab:"home",first:true};
  CONFIG.types.forEach(t=>S.sel[t.id]=t.products[0][0]);
  PIDS.forEach(id=>{S.market.mult[id]=1;S.market.hist[id]=[P[id].sys];S.listings[id]=[];const n=ri(5,6);for(let i=0;i<n;i++)S.listings[id].push(genListing(id))});
}
const sysPrice=id=>P[id].sys*S.market.mult[id];
const refPrice=id=>sysPrice(id)*(1+P[id].markup);
function genListing(id){
  const q=ri(20,85), c=pick(CONFIG.cities);
  let d=.34-(q-20)/65*.26+rr(-.04,.04), kelepir=rnd()<.1;
  if(kelepir)d+=rr(.08,.14);
  return{id:lid++,pid:id,seller:pick(CONFIG.sellers),city:c[0],km:c[1],q:q,qty:ri(10,80)*10,price:+(sysPrice(id)*(1-d)).toFixed(2),kelepir};
}
const ship=l=>+(l.km*CONFIG.shipPerKm).toFixed(2);
const net=l=>+(l.price+ship(l)).toFixed(2);
const sysListing=id=>({id:0,pid:id,seller:"Sistem Toptancısı",city:"İstanbul",km:20,q:50,qty:Infinity,price:+sysPrice(id).toFixed(2),sys:true});
function allListings(id){return S.listings[id].slice().sort((a,b)=>net(a)-net(b)).concat([sysListing(id)])}
const shopOf=pid=>S.shops.find(s=>s.type===P[pid].type);
const depotUsed=sh=>Object.values(sh.stock).reduce((s,x)=>s+x.q,0);
const depotCap=sh=>CONFIG.sizes[sh.size].depot;
const priceMult=r=>clamp(1+(1-r)*3,.6,1.6);
const qualMult=q=>q>=70?1.4:q>=40?.9+(q-40)/30*.2:.8;
function shelfRate(sh,sf){if(!sf)return 0;return P[sf.pid].rate*CONFIG.rateScale*priceMult(sf.price/refPrice(sf.pid))*qualMult(sh.stock[sf.pid].qual)}
const shopProfit=sh=>sh.shelves.reduce((s,sf)=>s+(sf&&sh.stock[sf.pid].q>0?shelfRate(sh,sf)*(sf.price-sh.stock[sf.pid].cost):0),0);
const profitPerMin=()=>S.shops.reduce((s,sh)=>s+shopProfit(sh),0);
const shopRent=sh=>Math.round(CONFIG.sizes[sh.size].rent*T[sh.type].tier*CONFIG.rentScale);
const upCost=sh=>sh.size<2?Math.round(T[sh.type].cost*CONFIG.sizes[sh.size+1].costK):null;
const xpNeed=n=>CONFIG.xpBase*Math.pow(n-1,CONFIG.xpPow);
function maxBuy(l){const sh=shopOf(l.pid);if(!sh||S.level<P[l.pid].lvl)return 0;return Math.max(0,Math.min(l.qty,Math.floor(S.cash/net(l)),depotCap(sh)-depotUsed(sh)))}
const roundP=x=>Math.round(x*20)/20;
function buy(l,qty){
  const sh=shopOf(l.pid);qty=Math.min(qty,maxBuy(l));if(!sh||qty<=0)return 0;
  const st=sh.stock[l.pid],cost=qty*net(l);
  st.qual=(st.qual*st.q+l.q*qty)/(st.q+qty);st.cost=(st.cost*st.q+cost)/(st.q+qty);st.q+=qty;
  S.cash-=cost;S.d.buy+=cost;
  if(!l.sys){l.qty-=qty;if(l.qty<=0)S.listings[l.pid]=S.listings[l.pid].filter(x=>x!==l)}
  if(!sh.shelves.some(s=>s&&s.pid===l.pid)){let i=sh.shelves.findIndex(s=>!s);if(i<0)i=sh.shelves.findIndex(s=>sh.stock[s.pid].q<=0);if(i>=0)sh.shelves[i]={pid:l.pid,price:roundP(refPrice(l.pid))}}
  S.first=false;return qty;
}
function upgrade(sh){const c=upCost(sh);if(c==null||S.cash<c)return false;S.cash-=c;sh.val+=c;sh.size++;fitShelves(sh);return true}
function openShop(type){const t=T[type];if(S.level<t.level||S.cash<t.cost||S.shops.some(s=>s.type===type))return false;S.cash-=t.cost;S.shops.push(mkShop(type));return true}
const assets=()=>S.shops.reduce((s,sh)=>s+sh.val+Object.values(sh.stock).reduce((a,x)=>a+x.q*x.cost,0),0);
const loanLimit=()=>Math.floor(assets()*CONFIG.loanRatio/100)*100;
function borrow(x){x=Math.min(x,loanLimit()-S.debt);if(x<=0)return 0;S.debt+=x;S.cash+=x;return x}
function repay(x){x=Math.min(x,S.debt,Math.max(0,S.cash));if(x<=0)return 0;S.debt-=x;S.cash-=x;return x}
function marketUpdate(){
  const keys=Object.keys(CONFIG.states).filter(k=>k!==S.market.state||rnd()<.25);
  S.market.state=pick(keys);const m=CONFIG.states[S.market.state].m;
  PIDS.forEach(id=>{S.market.mult[id]=m*(1+rr(-.04,.04));const h=S.market.hist[id];h.push(+sysPrice(id).toFixed(2));if(h.length>10)h.shift();
    S.listings[id]=S.listings[id].filter(()=>rnd()<.5);while(S.listings[id].length<4)S.listings[id].push(genListing(id))});
  S.market.nextAt=S.t+CONFIG.marketSec;ev("market");
}
function churn(){
  PIDS.forEach(id=>{const L=S.listings[id];
    if(L.length&&rnd()<.5){const l=L.slice().sort((a,b)=>net(a)-net(b))[0];l.qty-=ri(4,24)*10;if(l.qty<=0)S.listings[id]=L.filter(x=>x!==l)}
    if(S.listings[id].length<7&&rnd()<.45)S.listings[id].push(genListing(id))});
  ev("listings");
}
function endDay(){
  const rent=S.shops.reduce((s,sh)=>s+shopRent(sh),0)+S.debt*CONFIG.interestDay;S.cash-=rent;
  ev("day",{day:S.day,sold:S.d.sold,rent});S.day++;S.d={rev:0,buy:0,sold:0};
  if(S.cash<0&&S.shops.every(sh=>depotUsed(sh)===0)){S.dead=true;ev("dead")}
}
function step(dt){
  if(S.dead)return;S.t+=dt;
  S.shops.forEach((sh,si)=>sh.shelves.forEach(sf=>{if(!sf)return;const st=sh.stock[sf.pid];if(st.q<=0)return;
    sh.acc[sf.pid]+=shelfRate(sh,sf)*dt/60;const n=Math.min(st.q,Math.floor(sh.acc[sf.pid]));
    if(n>0){sh.acc[sf.pid]-=n;st.q-=n;const r=n*sf.price;S.cash+=r;S.xp+=r;S.d.rev+=r;S.d.sold+=n;ev("sale",{pid:sf.pid,n,r,si});if(st.q===0){sh.acc[sf.pid]=0;ev("empty",{pid:sf.pid})}}}));
  while(S.xp>=xpNeed(S.level+1)){S.level++;ev("level")}
  while(S.t>=S.churnAt){S.churnAt+=CONFIG.churnSec;churn()}
  while(S.t>=S.market.nextAt)marketUpdate();
  while(S.t>=S.day*CONFIG.daySec&&!S.dead)endDay();
}
let onEv=()=>{};function ev(k,d){onEv(k,d)}

/* ---- Arayüz ---- */
const $=id=>document.getElementById(id);
let dirty=true,pend={},sheetL=null,sheetQ=0,toastT;
const cur=()=>S.shops[S.cur];
function toast(m){const t=$("toast"),up=$("sheetbg").classList.contains("on");t.style.top=up?"104px":"auto";t.style.bottom=up?"auto":"66px";t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600)}
onEv=(k,d)=>{
  if(k==="sale"){const p=pend[d.pid]||(pend[d.pid]={n:0,r:0,si:d.si});p.n+=d.n;p.r+=d.r}
  else if(k==="market"){const s=S.market.state;toast("Piyasa güncellendi: "+CONFIG.states[s].ad+(s==="canli"?". Fiyatlar yükseldi.":s==="kotu"?". Fiyatlar düştü.":"."));dirty=true}
  else if(k==="listings"){if(S.tab==="market"&&!sheetL)dirty=true}
  else if(k==="empty"){toast(P[d.pid].ad+" bitti. Raf boş.");dirty=true}
  else if(k==="level"){toast(S.level+". seviye oldun. "+reward(S.level));dirty=true}
  else if(k==="day"){S.feed.unshift({t:d.day+". gün kapandı: "+d.sold+" satış, kira"+(S.debt>0?" ve faiz":""),v:-d.rent,si:-1});dirty=true}
  else if(k==="dead"){openEnd()}
};
function flushFeed(){let ch=false;for(const id in pend){const p=pend[id];S.feed.unshift({t:p.n+" × "+P[id].ad,v:p.r,nw:1,si:p.si});ch=true}pend={};if(S.feed.length>40)S.feed.length=40;
  if(ch&&S.tab==="shop"){const f=$("feed");if(f)f.innerHTML=feedHtml()}S.feed.forEach(x=>x.nw=0)}
const feedHtml=()=>{const F=S.feed.filter(x=>x.si===S.cur||x.si===-1).slice(0,10);return F.length?F.map(x=>`<div class="${x.nw?"new":""}"><span>${x.t}</span><b class="num ${x.v<0?"dn":"up"}">${x.v<0?"−":"+"}${tl(Math.abs(x.v))} TL</b></div>`).join(""):`<div><span class="sub">Henüz satış yok.</span></div>`};
function qTag(q){return `<span class="tag q ${q>=70?"hi":""}">%${Math.round(q)} kalite</span>`}
function spark(id){const h=S.market.hist[id];if(h.length<2)return"";const mn=Math.min(...h),mx=Math.max(...h),w=300,H=38;
  const pts=h.map((v,i)=>(i/(h.length-1)*w).toFixed(1)+","+(H-4-(mx===mn?.5:(v-mn)/(mx-mn))*(H-8)).toFixed(1)).join(" ");
  return `<svg class="sp" viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#17794a" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function reward(n){const a=CONFIG.types.filter(t=>t.level===n).map(t=>t.ad+" açılabilir"),b=PIDS.filter(id=>P[id].lvl===n&&n>T[P[id].type].level).map(id=>T[P[id].type].ad+": "+P[id].ad);return a.concat(b.length?["yeni ürün: "+b.join(", ")]:[]).join(" · ")}
const shopChips=()=>S.shops.length<2?"":`<div class="prods">`+S.shops.map((sh,i)=>`<button class="${i===S.cur?"on":""}" data-a="shopsel" data-v="${i}"><b>${T[sh.type].ad}</b><span>${CONFIG.sizes[sh.size].ad}</span></button>`).join("")+`</div>`;
const costBtn=(a,c,extra,dis)=>`<button class="btn" data-a="${a}" ${extra||""} data-cost="${c}" ${S.cash<c||dis?"disabled":""}>${tl(c,0)} TL</button>`;
function renderHome(){
  const nx=xpNeed(S.level+1),pv=xpNeed(S.level),nu=reward(S.level+1);
  let h=`<div class="card lvl"><div class="row"><div><div class="lbl">Seviye</div><b class="big num">${S.level}</b></div><div style="text-align:right"><div class="sub num" id="xpT">Sonraki seviyeye ${tl(Math.max(0,nx-S.xp),0)} TL ciro</div>${nu?`<div class="sub">${S.level+1}. seviyede: ${nu}</div>`:""}</div></div><div class="depo"><i id="xpB" data-a0="${pv}" data-a1="${nx}" style="width:${clamp((S.xp-pv)/(nx-pv)*100,0,100)}%"></i></div></div>`;
  if(S.first)h+=`<div class="card hint"><b>Rafların boş.</b><div class="sub" style="color:inherit;margin:4px 0 12px">Pazardan mal al. Aldığın mal anında depoya girer ve satılmaya başlar.</div><button class="btn full" data-a="tab" data-v="market">Pazara git</button></div>`;
  else{let al="";S.shops.forEach((sh,i)=>{sh.shelves.forEach(sf=>{if(sf&&sh.stock[sf.pid].q<=0)al+=`<div class="al"><span><b>${T[sh.type].ad}:</b> ${P[sf.pid].ad} bitti</span><button class="btn sm g" data-a="goto" data-v="${sf.pid}">Mal al</button></div>`});
      const e=sh.shelves.filter(x=>!x).length;if(e)al+=`<div class="al"><span><b>${T[sh.type].ad}:</b> ${e} raf boş</span><button class="btn sm ghost" data-a="gomarket" data-v="${i}">Pazar</button></div>`});
    if(S.debt>loanLimit())al+=`<div class="al"><span><b>Banka:</b> borcun kredi limitinin üstünde</span><button class="btn sm ghost" data-a="bank">Banka</button></div>`;
    if(al)h+=`<div class="card"><h2 style="margin-bottom:4px">Bekleyen işler</h2>${al}</div>`}
  h+=`<h3>Dükkânlarım</h3>`;
  S.shops.forEach((sh,i)=>{const u=depotUsed(sh),pr=shopProfit(sh);h+=`<button class="lst" data-a="shopgo" data-v="${i}"><div class="row"><div><b>${T[sh.type].ad}</b><div class="sm">${CONFIG.sizes[sh.size].ad} · İstanbul · ${sh.shelves.filter(x=>x).length}/${sh.shelves.length} raf dolu</div></div><div style="text-align:right"><b class="num ${pr>=0?"up":"dn"}">${pr>=0?"+":"−"}${tl(Math.abs(pr),0)} TL/dk</b><div class="sm num">kira ${tl(shopRent(sh),0)} TL/gün</div></div></div><div class="depo"><i style="width:${u/depotCap(sh)*100}%"></i></div></button>`});
  const lim=loanLimit();h+=`<h3>Banka</h3><button class="lst" data-a="bank"><div class="row"><div><b>${S.debt>0?"Borç "+tl(S.debt,0)+" TL":"Borcun yok"}</b><div class="sm num">Kredi limiti ${tl(lim,0)} TL · faiz günde %${tl(CONFIG.interestDay*100,1)}</div></div><div style="text-align:right"><b class="num ${S.debt>0?"dn":""}">${S.debt>0?"−"+tl(S.debt*CONFIG.interestDay,0)+" TL/gün":tl(Math.max(0,lim-S.debt),0)+" TL"}</b><div class="sm">${S.debt>0?"faiz":"çekilebilir"}</div></div></div></button>`;
  const rest=CONFIG.types.filter(t=>!S.shops.some(s=>s.type===t.id));
  if(rest.length){h+=`<h3>Yeni dükkân</h3>`;rest.forEach(t=>{const lk=S.level<t.level;h+=`<div class="card ${lk?"lock":""}"><div class="row"><div><h2>${t.ad}</h2><div class="sub">${t.products.slice(0,3).map(a=>a[1]).join(", ")} ve ${t.products.length-3} ürün daha</div></div>${lk?`<span class="tag q">${t.level}. seviyede açılır</span>`:costBtn("openshop",t.cost,`data-v="${t.id}"`)}</div></div>`})}
  return h}
function renderShop(){
  const sh=cur(),t=T[sh.type],u=depotUsed(sh);
  let h=shopChips()+`<div class="card"><div class="row"><div><h2>${t.ad}</h2><div class="sub">${CONFIG.sizes[sh.size].ad} dükkân · İstanbul · ${sh.shelves.length} raf</div></div><div style="text-align:right"><b class="num" id="depoN">${u}</b><span class="sub"> / ${depotCap(sh)} birim</span></div></div><div class="depo"><i id="depoB" style="width:${u/depotCap(sh)*100}%"></i></div></div>`;
  sh.shelves.forEach((sf,i)=>{
    if(!sf){h+=`<div class="card"><div class="row"><div><h2>${i+1}. raf</h2><div class="sub">Boş. Pazardan aldığın yeni ürün buraya yerleşir.</div></div><button class="btn ghost" data-a="gomarket" data-v="${S.cur}">Pazar</button></div></div>`;return}
    const st=sh.stock[sf.pid],ref=refPrice(sf.pid),r=sf.price/ref,rate=st.q>0?shelfRate(sh,sf):0,diff=(r-1)*100,pr=rate*(sf.price-st.cost);
    h+=`<div class="card"><div class="row"><div><h2>${P[sf.pid].ad}</h2><div class="sub">${i+1}. raf</div></div><div>${st.q>0?qTag(st.qual):`<span class="tag k">Stok yok</span>`}</div></div>
    <div class="kv"><div><b class="num" id="q-${sf.pid}">${st.q}</b><span>stok</span></div><div><b class="num">${tl(rate,1)}/dk</b><span>satış hızı</span></div><div><b class="num ${pr>=0?"up":"dn"}">${st.q>0?(pr>=0?"+":"−")+tl(Math.abs(pr),0):"0"} TL/dk</b><span>kâr</span></div></div>
    <div class="price"><button class="step" data-a="price" data-i="${i}" data-v="-1" aria-label="Fiyatı azalt">−</button><div class="pmid"><b class="num">${tl(sf.price)} TL</b><div class="sub num">piyasa ${tl(ref)} · <span class="${diff>0.5?"dn":diff<-0.5?"up":""}">${Math.abs(diff)<.5?"":diff>0?"+":"−"}%${tl(Math.abs(diff),0)}</span> · maliyet ${tl(st.cost)}</div></div><button class="step" data-a="price" data-i="${i}" data-v="1" aria-label="Fiyatı artır">+</button></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" data-a="swap" data-i="${i}">Ürünü değiştir</button><button class="btn g" style="flex:1" data-a="goto" data-v="${sf.pid}">Mal al</button></div></div>`});
  const c=upCost(sh);if(c!=null){const z=CONFIG.sizes[sh.size+1];h+=`<div class="card goal"><div class="row"><div><h2>${z.ad} dükkâna büyüt</h2><div class="sub">${z.shelves} raf, ${tl(z.depot,0)} birim depo. Kira ${tl(Math.round(z.rent*t.tier*CONFIG.rentScale),0)} TL/gün olur.</div></div>${costBtn("upgrade",c)}</div><div class="depo"><i id="goalB" data-c="${c}" style="width:${clamp(S.cash/c*100,0,100)}%"></i></div></div>`}
  h+=`<div class="card"><h2 style="margin-bottom:6px">Son satışlar</h2><div class="feed" id="feed">${feedHtml()}</div></div>`;
  return h}
function renderMarket(){
  const sh=cur(),t=T[sh.type],id=S.sel[t.id],p=P[id],h0=S.market.hist[id],prev=h0.length>1?h0[h0.length-2]:h0[0],c0=sysPrice(id),ch=(c0/prev-1)*100,st=sh.stock[id];
  let h=shopChips()+`<div class="prods">`+t.products.map(a=>{if(S.level<P[a[0]].lvl)return `<button class="lock" data-a="sel" data-v="${a[0]}"><b>${a[1]}</b><span>${P[a[0]].lvl}. seviye</span></button>`;const b=allListings(a[0])[0];return `<button class="${a[0]===id?"on":""}" data-a="sel" data-v="${a[0]}"><b>${a[1]}</b><span class="num">${tl(net(b))} TL</span></button>`}).join("")+`</div>`;
  h+=`<div class="card"><div class="row"><div><h2>${p.ad}</h2><div class="sub num">Sistem fiyatı ${tl(c0)} TL <span class="${ch>0.5?"up":ch<-0.5?"dn":""}">${Math.abs(ch)<.5?"":(ch>0?"▲":"▼")+" %"+tl(Math.abs(ch),0)}</span></div></div><div style="text-align:right"><b class="num">${tl(refPrice(id))} TL</b><div class="sub">dükkânda satılır</div></div></div>${spark(id)}<div class="sub num">${t.ad} deposunda: ${st.q} birim${st.q?` · %${Math.round(st.qual)} kalite · ${tl(st.cost)} TL maliyet`:""} · temel hız ${tl(p.rate,1)}/dk</div></div>`;
  allListings(id).forEach((l,i)=>{const mrg=(refPrice(id)/net(l)-1)*100;
    h+=`<button class="lst ${l.sys?"sys":""}" data-a="open" data-v="${l.id}"><div class="row"><div><b>${l.seller}</b> ${i===0&&!l.sys?`<span class="tag best">En ucuz</span>`:""} ${l.kelepir?`<span class="tag k">Kelepir</span>`:""}<div class="sm">${l.city} · ${l.km} km · ${l.sys?"sınırsız":l.qty+" birim"}</div></div><div style="text-align:right"><div class="net num">${tl(net(l))} TL</div><div class="sm num">${tl(l.price)} + ${tl(ship(l))} nakliye</div></div></div><div class="row" style="margin-top:8px">${qTag(l.q)}<span class="sm num">hız ×${tl(qualMult(l.q),1)} · <span class="${mrg>0?"up":"dn"}">${mrg>=0?"+":"−"}%${tl(Math.abs(mrg),0)} marj</span></span></div></button>`});
  return h}
function render(){
  $("main").innerHTML=S.tab==="home"?renderHome():S.tab==="shop"?renderShop():renderMarket();
  ["home","shop","market"].forEach(k=>$("t-"+k).className=S.tab===k?"on":"");dirty=false;tickUI()}
function tickUI(){
  const c=$("cash");c.textContent=tl(S.cash,S.cash<10000?2:0)+" TL";c.className="num"+(S.cash<0?" neg":"");
  const pm=profitPerMin();$("ppm").textContent=(pm>=0?"+":"−")+tl(Math.abs(pm),0)+" TL/dk";$("day").textContent=S.day+". gün";
  const m=$("mst");m.textContent=CONFIG.states[S.market.state].ad;m.className="chip st-"+S.market.state;
  const left=Math.max(0,S.market.nextAt-S.t);$("mcd").textContent=Math.floor(left/60)+":"+String(Math.floor(left%60)).padStart(2,"0");$("mbar").style.width=(100-left/CONFIG.marketSec*100)+"%";
  $("spd").textContent=S.speed+"×";
  if(S.tab==="shop"){const sh=cur(),d=depotUsed(sh),n=$("depoN");if(n){n.textContent=d;$("depoB").style.width=d/depotCap(sh)*100+"%"}
    sh.shelves.forEach(sf=>{if(sf){const e=$("q-"+sf.pid);if(e)e.textContent=sh.stock[sf.pid].q}});
    const g=$("goalB");if(g)g.style.width=clamp(S.cash/+g.dataset.c*100,0,100)+"%"}
  if(S.tab==="home"){const b=$("xpB");if(b){const a0=+b.dataset.a0,a1=+b.dataset.a1;b.style.width=clamp((S.xp-a0)/(a1-a0)*100,0,100)+"%";$("xpT").textContent="Sonraki seviyeye "+tl(Math.max(0,a1-S.xp),0)+" TL ciro"}}
  $("main").querySelectorAll("[data-cost]").forEach(b=>{if(b.disabled!==(S.cash<+b.dataset.cost))dirty=true});
}
/* ---- Alt sayfalar ---- */
function openSheet(html){$("sheet").innerHTML=html;$("sheetbg").classList.add("on")}
function closeSheet(){$("sheetbg").classList.remove("on");sheetL=null;dirty=true}
function findL(v){const id=S.sel[cur().type];return v==="0"?sysListing(id):S.listings[id].find(l=>l.id==v)}
function buyCalc(){const l=sheetL,st=shopOf(l.pid).stock[l.pid],nq=st.q+sheetQ,nqual=nq?(st.qual*st.q+l.q*sheetQ)/nq:0,ncost=nq?(st.cost*st.q+net(l)*sheetQ)/nq:0,pr=refPrice(l.pid)-ncost;
  $("sq").textContent=sheetQ+" birim";$("stot").textContent=tl(sheetQ*net(l))+" TL";$("savg").textContent="%"+Math.round(nqual)+" kalite · "+tl(ncost)+" TL";
  const e=$("sprof");e.textContent="birim başı "+tl(pr)+" TL";e.className=pr>0?"up":"dn";$("sbuy").textContent=sheetQ+" birim al";$("qr").value=sheetQ}
function buySheet(){
  const l=sheetL,mx=maxBuy(l),sh=shopOf(l.pid);sheetQ=clamp(sheetQ,mx>0?1:0,mx);
  const why=mx>0?"":S.cash<net(l)?"Kasada yeterli para yok.":depotCap(sh)-depotUsed(sh)<=0?"Depo dolu.":"";
  openSheet(`<div class="row"><div><h2>${P[l.pid].ad}</h2><div class="sub">${l.seller} · ${l.city} (${l.km} km)</div></div>${qTag(l.q)}</div>
  <table class="tbl num"><tr><td>Birim fiyat</td><td>${tl(l.price)} TL</td></tr><tr><td>Nakliye</td><td>${tl(ship(l))} TL</td></tr><tr><td>Net fiyat</td><td class="up">${tl(net(l))} TL</td></tr></table>
  ${mx>0?`<div class="row"><b>Miktar</b><b class="num" style="font-size:20px" id="sq"></b></div><input type="range" id="qr" min="1" max="${mx}" value="${sheetQ}">
  <div class="qk"><button data-a="qk" data-v=".25">%25</button><button data-a="qk" data-v=".5">%50</button><button data-a="qk" data-v="1">En fazla (${mx})</button></div>
  <table class="tbl num"><tr><td>Toplam</td><td id="stot"></td></tr><tr><td>Depoda yeni ortalama</td><td id="savg"></td></tr><tr><td>Piyasa fiyatından satarsan</td><td id="sprof"></td></tr></table>
  <button class="btn g full" data-a="buy" id="sbuy"></button>`:`<div class="card hint">${why}</div><button class="btn ghost full" data-a="close">Kapat</button>`}
  ${S.cash<net(l)*Math.min(l.qty,depotCap(sh)-depotUsed(sh))&&loanLimit()-S.debt>=100?`<button class="btn ghost full" style="margin-top:8px" data-a="bank">Kasan yetmiyor: bankadan kredi çek (${tl(loanLimit()-S.debt,0)} TL)</button>`:""}`);
  const r=$("qr");if(r){r.oninput=()=>{sheetQ=+r.value;buyCalc()};buyCalc()}}
function swapSheet(i){const sh=cur(),have=T[sh.type].products.map(a=>P[a[0]]).filter(p=>sh.stock[p.id].q>0&&!sh.shelves.some(s=>s&&s.pid===p.id));
  openSheet(`<h2 style="margin-bottom:10px">${i+1}. rafta ne satılsın?</h2>`+(have.length?have.map(p=>`<button class="lst" data-a="setp" data-i="${i}" data-v="${p.id}"><div class="row"><b>${p.ad}</b><span class="sm num">${sh.stock[p.id].q} birim · %${Math.round(sh.stock[p.id].qual)}</span></div></button>`).join(""):`<div class="sub" style="margin-bottom:12px">Depoda rafta olmayan başka ürün yok. Önce pazardan al.</div>`)+`<button class="btn ghost full" data-a="close">Kapat</button>`)}
function bankSheet(){sheetL=null;const lim=loanLimit(),av=Math.floor(Math.max(0,lim-S.debt)/100)*100,rp=Math.floor(Math.min(S.debt,Math.max(0,S.cash))),f=x=>tl(x,0)+" TL";
  openSheet(`<h2>Banka</h2><div class="sub">Kredi limitin, dükkânlarının ve depodaki malın değerinin %${Math.round(CONFIG.loanRatio*100)} kadarıdır. Faiz her gün sonunda kasadan kesilir.</div>
  <table class="tbl num"><tr><td>Borç</td><td>${f(S.debt)}</td></tr><tr><td>Kredi limiti</td><td>${f(lim)}</td></tr><tr><td>Günlük faiz (%${tl(CONFIG.interestDay*100,1)})</td><td>${f(S.debt*CONFIG.interestDay)}</td></tr></table>
  ${av>=100?`<div class="row"><b>Kredi çek</b><b class="num" id="bv"></b></div><input type="range" id="bq" min="100" max="${av}" step="100" value="${Math.max(100,Math.floor(av/200)*100)}"><button class="btn g full" data-a="borrow">Kredi çek</button>`:`<div class="card hint">Çekilebilir kredin yok.</div>`}
  ${rp>=1?`<div class="row" style="margin-top:16px"><b>Borç öde</b><b class="num" id="pv"></b></div><input type="range" id="pq" min="1" max="${rp}" value="${rp}"><button class="btn full" data-a="repay">Borç öde</button>`:""}
  <button class="btn ghost full" style="margin-top:10px" data-a="close">Kapat</button>`);
  const b=$("bq"),q=$("pq");if(b){const u=()=>$("bv").textContent=f(+b.value)+" · faizi "+f((S.debt+ +b.value)*CONFIG.interestDay)+"/gün";b.oninput=u;u()}if(q){const u=()=>$("pv").textContent=f(+q.value);q.oninput=u;u()}}
function settingsSheet(){const r=(k,a,b,s,lab)=>`<div class="row" style="margin-top:10px"><span>${lab}</span><b class="num" id="v-${k}">${CONFIG[k]}</b></div><input type="range" id="r-${k}" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${CONFIG[k]}">`;
  openSheet(`<h2>Ayar paneli</h2><div class="sub">Denge değerleri. Değişiklik anında uygulanır.</div>${r("marketSec",30,1200,30,"Piyasa güncelleme aralığı (sn)")}${r("rateScale",.5,3,.1,"Satış hızı çarpanı")}${r("rentScale",0,3,.1,"Kira çarpanı")}${r("daySec",60,600,30,"Bir günün süresi (sn)")}${r("shipPerKm",0,.02,.001,"Nakliye (TL/km)")}${r("loanRatio",0,1,.05,"Kredi limiti oranı")}${r("interestDay",0,.1,.005,"Günlük faiz oranı")}
  <div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" data-a="reset">Oyunu sıfırla</button><button class="btn" style="flex:1" data-a="close">Tamam</button></div>`);
  $("sheet").querySelectorAll("input").forEach(i=>i.oninput=()=>{CONFIG[i.dataset.k]=+i.value;$("v-"+i.dataset.k).textContent=i.value})}
function openEnd(){S.speed=1;openSheet(`<h2>İflas ettin.</h2><p>Kasa ekside ve depolarda satacak mal kalmadı (${S.day-1}. gün).</p><button class="btn full" data-a="reset">Yeniden başla</button>`)}
/* ---- Dokunma ---- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,i=+b.dataset.i,top=()=>$("main").scrollTop=0;
  if(a==="closebg"){if(e.target===b&&!S.dead)closeSheet();return}
  if(a==="tab"){S.tab=v;top()}
  else if(a==="shopsel")S.cur=+v;
  else if(a==="shopgo"){S.cur=+v;S.tab="shop";top()}
  else if(a==="gomarket"){S.cur=+v;S.tab="market";top()}
  else if(a==="sel"){if(S.level<P[v].lvl){toast(P[v].ad+" "+P[v].lvl+". seviyede açılır.");return}S.sel[cur().type]=v}
  else if(a==="bank"){bankSheet();return}
  else if(a==="borrow"){const x=borrow(+$("bq").value);if(x)toast(tl(x,0)+" TL kredi çekildi.");bankSheet();tickUI();return}
  else if(a==="repay"){const x=repay(+$("pq").value);if(x)toast(tl(x,0)+" TL borç ödendi.");bankSheet();tickUI();return}
  else if(a==="goto"){S.cur=S.shops.indexOf(shopOf(v));S.sel[P[v].type]=v;S.tab="market";top()}
  else if(a==="speed")S.speed=S.speed===1?3:S.speed===3?10:1;
  else if(a==="price"){const sf=cur().shelves[i],ref=refPrice(sf.pid),stp=Math.max(.05,roundP(ref*.02));sf.price=clamp(roundP(sf.price+stp*v),roundP(ref*.7),roundP(ref*1.3))}
  else if(a==="open"){const l=findL(v);if(!l){toast("Bu ilan az önce tükendi.");dirty=true;return}sheetL=l;sheetQ=Math.ceil(maxBuy(l)/2);buySheet();return}
  else if(a==="qk"){sheetQ=Math.max(1,Math.floor(maxBuy(sheetL)*v));buyCalc();return}
  else if(a==="buy"){const l=sheetL;if(!l.sys&&!S.listings[l.pid].includes(l)){toast("Bu ilan az önce tükendi.");closeSheet();return}
    const n=buy(l,sheetQ);closeSheet();if(n){toast(n+" birim "+P[l.pid].ad+" depoya girdi.");S.tab="shop";top()}}
  else if(a==="swap"){swapSheet(i);return}
  else if(a==="setp"){cur().shelves[i]={pid:v,price:roundP(refPrice(v))};closeSheet()}
  else if(a==="upgrade"){const sh=cur();if(upgrade(sh))toast(T[sh.type].ad+" artık "+CONFIG.sizes[sh.size].ad.toLowerCase()+" dükkân.")}
  else if(a==="openshop"){if(openShop(v)){S.cur=S.shops.length-1;S.tab="market";top();toast(T[v].ad+" açıldı. Raflar için mal al.")}}
  else if(a==="settings"){settingsSheet();return}
  else if(a==="reset"){newGame();closeSheet();save()}
  else if(a==="close"){closeSheet()}
  dirty=true;render()});
/* ---- Kayıt ve döngü ---- */
function save(){try{localStorage.setItem("kervan-dp4",JSON.stringify({S,lid}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem("kervan-dp4"));if(j&&j.S&&j.S.shops&&!j.S.dead&&PIDS.every(id=>j.S.listings[id])){S=j.S;lid=j.lid;return true}}catch(e){}return false}
if(!load())newGame();
render();
let fc=0;
if(!/[?&]sim/.test(location.search))setInterval(()=>{step(.25*S.speed);if(++fc%4===0)flushFeed();if(fc%40===0)save();if(dirty&&!$("sheetbg").classList.contains("on"))render();else tickUI()},250);
window.__k={get S(){return S},CONFIG,P,T,step,buy,allListings,net,refPrice,newGame,depotUsed,depotCap,qualMult,upgrade,openShop,upCost,shopOf,loanLimit,borrow,repay,seed:v=>{seed=v}};
</script>
